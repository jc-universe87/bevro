name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing in CI needs to write to the repository.
permissions:
  contents: read

# A new push supersedes the run in progress for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bevro
          POSTGRES_PASSWORD: bevro
          POSTGRES_DB: bevro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bevro -d bevro"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BEVRO_TEST_DATABASE_URL: postgresql+psycopg://bevro:bevro@localhost:5432/bevro_test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # Never the real Claude CLI: tests use api/tests/fake_claude.py; the
      # real-CLI test is skipped unless BEVRO_RUN_CLAUDE_INTEGRATION=1.
      # No routing model, no mail server, no coding CLI, no private agents:
      # the suite must pass on a bare runner or it is not a real test.
      - run: cd api && pytest -q -p no:warnings
      - name: Migrations apply to a clean database
        env:
          BEVRO_DATABASE_URL: postgresql+psycopg://bevro:bevro@localhost:5432/bevro
        run: cd api && alembic upgrade head

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
