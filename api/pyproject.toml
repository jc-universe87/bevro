[project]
name = "bevro-api"
version = "0.1.0"
description = "Bevro API - a self-hosted hub that brings your AI agents and apps together."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-mock>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["/srv", "."]
